<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1680" viewBox="0 0 960 1680" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <rect width="960" height="1680" fill="url(#bg)"/>

  <text x="480" y="64" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="bold">🚛 货运雷达 · 开发流程时间线</text>
  <text x="480" y="100" text-anchor="middle" fill="#9ca3af" font-size="17">P0 → P17 · 18 个阶段 · 从"核心引擎"到"真实数据+车队互助"</text>

  <!-- 时间轴线 -->
  <line x1="120" y1="140" x2="120" y2="1620" stroke="#374151" stroke-width="4"/>

  <!-- 节点数据：x,y 由循环生成；此处逐个节点 -->
  <!-- P0 -->
  <circle cx="120" cy="170" r="14" fill="url(#node)"/>
  <text x="120" y="176" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">0</text>
  <rect x="160" y="138" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="162" fill="#fb923c" font-size="17" font-weight="bold">P0 核心引擎</text>
  <text x="184" y="185" fill="#cbd5e1" font-size="13.5">TS工程 + 成本计算 + 评分引擎 + 数据访问层 + AI编排 + API + 测试</text>

  <!-- P1 -->
  <circle cx="120" cy="252" r="14" fill="url(#node)"/>
  <text x="120" y="258" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text>
  <rect x="160" y="220" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="244" fill="#fb923c" font-size="17" font-weight="bold">P1 移动端产品层</text>
  <text x="184" y="267" fill="#cbd5e1" font-size="13.5">React 前端（Dashboard/货源大厅/详情/AI助手/订单/我的）+ 底部导航 + 状态处理</text>

  <!-- P2 -->
  <circle cx="120" cy="334" r="14" fill="url(#node)"/>
  <text x="120" y="340" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text>
  <rect x="160" y="302" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="326" fill="#fb923c" font-size="17" font-weight="bold">P2 订单与决策增强</text>
  <text x="184" y="349" fill="#cbd5e1" font-size="13.5">订单模块（接单→证据链8步→损耗对比→证据包）+ 司机底线 + 价格异常检测</text>

  <!-- P3 -->
  <circle cx="120" cy="416" r="14" fill="url(#node)"/>
  <text x="120" y="422" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text>
  <rect x="160" y="384" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="408" fill="#fb923c" font-size="17" font-weight="bold">P3 信用与个性化</text>
  <text x="184" y="431" fill="#cbd5e1" font-size="13.5">货主信用（三档评价/黑名单/降权）+ 真实API仓储 + 历史画像 + 空驶真实化</text>

  <!-- P4 -->
  <circle cx="120" cy="498" r="14" fill="url(#node)"/>
  <text x="120" y="504" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">4</text>
  <rect x="160" y="466" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="490" fill="#fb923c" font-size="17" font-weight="bold">P4 路线与环境</text>
  <text x="184" y="513" fill="#cbd5e1" font-size="13.5">高德客户端（路径/天气/POI）+ 路线策略（高速/国道）+ 天气影响 + 沿途补给</text>

  <!-- P5 -->
  <circle cx="120" cy="580" r="14" fill="url(#node)"/>
  <text x="120" y="586" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">5</text>
  <rect x="160" y="548" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="572" fill="#fb923c" font-size="17" font-weight="bold">P5 持久化与决策增强</text>
  <text x="184" y="595" fill="#cbd5e1" font-size="13.5">JSON文件持久化 + 路线偏好记忆 + 沿途多段天气 + 行情区间 + Docker部署</text>

  <!-- P6 -->
  <circle cx="120" cy="662" r="14" fill="url(#node)"/>
  <text x="120" y="668" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">6</text>
  <rect x="160" y="630" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="654" fill="#fb923c" font-size="17" font-weight="bold">P6 持久化升级与账号</text>
  <text x="184" y="677" fill="#cbd5e1" font-size="13.5">SQLite（node:sqlite零依赖）+ 多司机账号 + SSE实时推送 + 行情抽象</text>

  <!-- P7 -->
  <circle cx="120" cy="744" r="14" fill="url(#node)"/>
  <text x="120" y="750" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">7</text>
  <rect x="160" y="712" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="736" fill="#fb923c" font-size="17" font-weight="bold">P7 登录与实时通道</text>
  <text x="184" y="759" fill="#cbd5e1" font-size="13.5">登录鉴权（scrypt密码哈希）+ WebSocket双向推送 + 行情指数API</text>

  <!-- P8 -->
  <circle cx="120" cy="826" r="14" fill="url(#node)"/>
  <text x="120" y="832" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">8</text>
  <rect x="160" y="794" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="818" fill="#fb923c" font-size="17" font-weight="bold">P8 账号安全与多端</text>
  <text x="184" y="841" fill="#cbd5e1" font-size="13.5">会话TTL + 手机号验证码登录 + 鉴权中间件 + 多端同步 + 小程序云同步</text>

  <!-- P9 -->
  <circle cx="120" cy="908" r="14" fill="url(#node)"/>
  <text x="120" y="914" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">9</text>
  <rect x="160" y="876" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="900" fill="#fb923c" font-size="17" font-weight="bold">P9 登录体验与安全</text>
  <text x="184" y="923" fill="#cbd5e1" font-size="13.5">扫码登录 + 短信限流 + 会话清理 + 请求日志 + 上线检查清单</text>

  <!-- P10 -->
  <circle cx="120" cy="990" r="14" fill="url(#node)"/>
  <text x="120" y="996" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">10</text>
  <rect x="160" y="958" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="982" fill="#fb923c" font-size="17" font-weight="bold">P10 数据可视化与安全</text>
  <text x="184" y="1005" fill="#cbd5e1" font-size="13.5">统计模块 + 收益柱状图 + 登录失败锁定 + 密码强度 + 演示货源API</text>

  <!-- P11 -->
  <circle cx="120" cy="1072" r="14" fill="url(#node)"/>
  <text x="120" y="1078" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">11</text>
  <rect x="160" y="1040" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="1064" fill="#fb923c" font-size="17" font-weight="bold">P11 数据精确与对账</text>
  <text x="184" y="1087" fill="#cbd5e1" font-size="13.5">记账km字段 + CSV导出 + 短信/行情Provider抽象 + docker-compose</text>

  <!-- P12 -->
  <circle cx="120" cy="1154" r="14" fill="url(#node)"/>
  <text x="120" y="1160" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">12</text>
  <rect x="160" y="1122" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="1146" fill="#fb923c" font-size="17" font-weight="bold">P12 收益账本页</text>
  <text x="184" y="1169" fill="#cbd5e1" font-size="13.5">前端账本页（记一笔/明细/km补录/删除）+ 记账CRUD + CSV每公里列</text>

  <!-- P13 -->
  <circle cx="120" cy="1236" r="14" fill="url(#node)"/>
  <text x="120" y="1242" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">13</text>
  <rect x="160" y="1204" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="1228" fill="#fb923c" font-size="17" font-weight="bold">P13 账本增强与容错</text>
  <text x="184" y="1251" fill="#cbd5e1" font-size="13.5">账目整条编辑 + 月度汇总补全 + 打印/存PDF + 高德失败自动降级</text>

  <!-- P14 -->
  <circle cx="120" cy="1318" r="14" fill="url(#node)"/>
  <text x="120" y="1324" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">14</text>
  <rect x="160" y="1286" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="1310" fill="#fb923c" font-size="17" font-weight="bold">P14 真实LLM接入</text>
  <text x="184" y="1333" fill="#cbd5e1" font-size="13.5">火山方舟 DeepSeek-V4（OpenAI兼容 + 模型探测 + 失败回退规则引擎）</text>

  <!-- P15 -->
  <circle cx="120" cy="1400" r="14" fill="url(#node)"/>
  <text x="120" y="1406" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">15</text>
  <rect x="160" y="1368" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="1392" fill="#fb923c" font-size="17" font-weight="bold">P15 报表与多端</text>
  <text x="184" y="1415" fill="#cbd5e1" font-size="13.5">HTML报表导出 + 货源API分页 + AI引擎徽标 + 小程序云端货源</text>

  <!-- P16 -->
  <circle cx="120" cy="1482" r="14" fill="url(#node)"/>
  <text x="120" y="1488" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">16</text>
  <rect x="160" y="1450" width="760" height="62" rx="12" fill="#111827" stroke="#374151"/>
  <text x="184" y="1474" fill="#fb923c" font-size="17" font-weight="bold">P16 高德真实数据+信用管理</text>
  <text x="184" y="1497" fill="#cbd5e1" font-size="13.5">高德API接入（真实路线/天气/POI）+ 货主信用管理页</text>

  <!-- P17 -->
  <circle cx="120" cy="1564" r="16" fill="#4ade80"/>
  <text x="120" y="1570" text-anchor="middle" fill="#111827" font-size="12" font-weight="bold">17</text>
  <rect x="160" y="1532" width="760" height="62" rx="12" fill="#052e16" stroke="#16a34a"/>
  <text x="184" y="1556" fill="#4ade80" font-size="17" font-weight="bold">P17 手动发单（车队互助）</text>
  <text x="184" y="1579" fill="#d1fae5" font-size="13.5">车队互助货源池 · 零成本真实货源来源 · 闭环完成</text>

  <!-- 底部说明 -->
  <text x="480" y="1650" text-anchor="middle" fill="#6b7280" font-size="13">✅ 最终状态：找货 → 算账 → 评分 → AI推荐 → 信用避坑 → 接单 → 证据链 → 记账 → 报表 · 全链路可用</text>
</svg>
