<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="root" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1050" fill="url(#bg2)"/>

  <text x="500" y="46" text-anchor="middle" fill="#1c1c1e" font-size="30" font-weight="bold">🚛 货运雷达 · 架构树状图</text>

  <!-- 根节点 -->
  <rect x="360" y="72" width="280" height="48" rx="24" fill="url(#root)"/>
  <text x="500" y="102" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">货运雷达</text>

  <!-- 主干线 -->
  <line x1="500" y1="120" x2="500" y2="150" stroke="#cbd5e1" stroke-width="3"/>

  <!-- 五大分支横线 -->
  <line x1="110" y1="150" x2="890" y2="150" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="110" y1="150" x2="110" y2="172" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="305" y1="150" x2="305" y2="172" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="500" y1="150" x2="500" y2="172" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="695" y1="150" x2="695" y2="172" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="890" y1="150" x2="890" y2="172" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 五大模块标题 -->
  <rect x="30" y="172" width="160" height="42" rx="10" fill="#f97316"/>
  <text x="110" y="199" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">🧠 核心业务层</text>

  <rect x="225" y="172" width="160" height="42" rx="10" fill="#3b82f6"/>
  <text x="305" y="199" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">🗄️ 数据访问层</text>

  <rect x="420" y="172" width="160" height="42" rx="10" fill="#8b5cf6"/>
  <text x="500" y="199" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">🤖 AI 层</text>

  <rect x="615" y="172" width="160" height="42" rx="10" fill="#16a34a"/>
  <text x="695" y="199" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">🌐 服务层</text>

  <rect x="810" y="172" width="160" height="42" rx="10" fill="#0ea5e9"/>
  <text x="890" y="199" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">📱 前端</text>

  <!-- 核心业务层子项 -->
  <g font-size="13" fill="#334155">
    <rect x="30" y="224" width="160" height="30" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="110" y="244" text-anchor="middle">types.ts 领域模型</text>
    <rect x="30" y="260" width="160" height="30" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="110" y="280" text-anchor="middle">cost.ts ★成本引擎</text>
    <rect x="30" y="296" width="160" height="30" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="110" y="316" text-anchor="middle">scoring.ts ★评分</text>
    <rect x="30" y="332" width="160" height="30" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="110" y="352" text-anchor="middle">credit.ts 货主信用</text>
    <rect x="30" y="368" width="160" height="30" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="110" y="388" text-anchor="middle">order.ts 订单/证据链</text>
    <rect x="30" y="404" width="160" height="30" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="110" y="424" text-anchor="middle">stats.ts 统计/报表</text>
    <rect x="30" y="440" width="160" height="30" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="110" y="460" text-anchor="middle">quote/weather/route</text>
    <rect x="30" y="476" width="160" height="30" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="110" y="496" text-anchor="middle">auth/scanLogin</text>
  </g>

  <!-- 数据访问层子项 -->
  <g font-size="13" fill="#334155">
    <rect x="225" y="224" width="160" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd"/><text x="305" y="244" text-anchor="middle">repository.ts ★接口</text>
    <rect x="225" y="260" width="160" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd"/><text x="305" y="280" text-anchor="middle">sqliteRepository</text>
    <rect x="225" y="296" width="160" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd"/><text x="305" y="316" text-anchor="middle">mock / file / api</text>
    <rect x="225" y="332" width="160" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd"/><text x="305" y="352" text-anchor="middle">amap.ts ★高德</text>
    <rect x="225" y="368" width="160" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd"/><text x="305" y="388" text-anchor="middle">providers.ts 抽象</text>
    <rect x="225" y="404" width="160" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd"/><text x="305" y="424" text-anchor="middle">seed.ts 种子数据</text>
  </g>

  <!-- AI 层子项 -->
  <g font-size="13" fill="#334155">
    <rect x="420" y="224" width="160" height="30" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/><text x="500" y="244" text-anchor="middle">llm.ts ★LlmPort接口</text>
    <rect x="420" y="260" width="160" height="30" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/><text x="500" y="280" text-anchor="middle">arkLlm.ts ★火山DeepSeek</text>
    <rect x="420" y="296" width="160" height="30" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/><text x="500" y="316" text-anchor="middle">ruleLlm.ts 规则兜底</text>
    <rect x="420" y="332" width="160" height="30" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/><text x="500" y="352" text-anchor="17.5 middle">assistant.ts ★推荐编排</text>
  </g>

  <!-- 服务层子项 -->
  <g font-size="13" fill="#334155">
    <rect x="615" y="224" width="160" height="30" rx="6" fill="#f0fdf4" stroke="#86efac"/><text x="695" y="244" text-anchor="middle">app.ts ★Express+路由</text>
    <rect x="615" y="260" width="160" height="30" rx="6" fill="#f0fdf4" stroke="#86efac"/><text x="695" y="280" text-anchor="middle">services.ts 应用服务</text>
    <rect x="615" y="296" width="160" height="30" rx="6" fill="#f0fdf4" stroke="#86efac"/><text x="695" y="316" text-anchor="middle">routeService 路线环境</text>
    <rect x="615" y="332" width="160" height="30" rx="6" fill="#f0fdf4" stroke="#86efac"/><text x="695" y="352" text-anchor="middle">pushHub WebSocket</text>
    <rect x="615" y="368" width="160" height="30" rx="6" fill="#f0fdf4" stroke="#86efac"/><text x="695" y="388" text-anchor="middle">index.ts 入口</text>
  </g>

  <!-- 前端子项 -->
  <g font-size="13" fill="#334155">
    <rect x="810" y="224" width="160" height="30" rx="6" fill="#f0f9ff" stroke="#7dd3fc"/><text x="890" y="244" text-anchor="middle">App.tsx 路由+导航</text>
    <rect x="810" y="260" width="160" height="30" rx="6" fill="#f0f9ff" stroke="#7dd3fc"/><text x="890" y="280" text-anchor="middle">api/client ★网络出口</text>
    <rect x="810" y="296" width="160" height="30" rx="6" fill="#f0f9ff" stroke="#7dd3fc"/><text x="890" y="316" text-anchor="middle">9个页面 pages/</text>
    <rect x="810" y="332" width="160" height="30" rx="6" fill="#f0f9ff" stroke="#7dd3fc"/><text x="890" y="352" text-anchor="middle">components/ui 通用</text>
  </g>

  <!-- 底层：存储与外部 -->
  <line x1="500" y1="520" x2="500" y2="560" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="330" y="560" width="340" height="46" rx="12" fill="#1f2937"/>
  <text x="500" y="589" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">SQLite 持久化（node:sqlite）</text>

  <!-- 外部依赖 -->
  <text x="500" y="660" text-anchor="middle" fill="#6b7280" font-size="15">外部真实 API（失败自动降级）</text>
  <rect x="150" y="680" width="220" height="46" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="260" y="709" text-anchor="middle" fill="#4338ca" font-size="15" font-weight="bold">🔴 火山方舟 DeepSeek-V4</text>
  <rect x="400" y="680" width="200" height="46" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="500" y="709" text-anchor="middle" fill="#c2410c" font-size="15" font-weight="bold">🗺️ 高德 Web 服务</text>
  <rect x="630" y="680" width="220" height="46" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="740" y="709" text-anchor="middle" fill="#15803d" font-size="15" font-weight="bold">🚚 货源 API（可切换）</text>

  <!-- 质量与部署 -->
  <rect x="150" y="770" width="700" height="46" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="500" y="799" text-anchor="middle" fill="#334155" font-size="15">✅ 191 测试 ｜ TS 严格模式 ｜ Docker/Compose/Nginx/HTTPS ｜ 多司机/登录鉴权</text>

  <!-- 图例 -->
  <text x="500" y="860" text-anchor="middle" fill="#94a3b8" font-size="13">★ = 关键模块 ｜ 箭头方向 = 依赖/调用方向</text>
</svg>
