name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装后端依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 单元/集成测试（含文档新鲜度校验 docs.test.ts）
        run: npm test

      - name: SQLite 能力测试
        run: npm run test:sqlite

      - name: 后端构建
        run: npm run build

      - name: 前端依赖与构建
        working-directory: web
        run: |
          npm ci
          npm run build
